server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/store
    username: admin
    password: admin
  data:
    redis:
      host: cache
      port: 6379
      connect-timeout: 250ms
      timeout: 250ms
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 10
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

store:
  paging:
    default-size: 20
    max-size: 100
